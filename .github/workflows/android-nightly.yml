name: Android nightly

on:
  schedule:
    - cron: "20 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :app:micaNightlyCheck --no-configuration-cache
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-evidence
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/roborazzi/

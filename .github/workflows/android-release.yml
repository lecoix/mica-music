name: Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.2.5.0"
        required: true
        type: string
      changelog:
        description: "Optional override for the update manifest; annotated tag message is used when empty"
        required: false
        type: string
      domestic_download_url:
        description: "Optional 123 download page; otherwise UPDATE_DOMESTIC_DOWNLOAD_URL is used"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DOMESTIC_MANIFEST_URL: ${{ vars.UPDATE_DOMESTIC_MANIFEST_URL || '' }}
      DOMESTIC_DOWNLOAD_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.domestic_download_url || vars.UPDATE_DOMESTIC_DOWNLOAD_URL || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify submodules
        run: git submodule status --recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve release metadata
        id: metadata
        env:
          MANUAL_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${MANUAL_TAG:-$REF_TAG}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi

          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ -z "$VERSION_NAME" || -z "$VERSION_CODE" ]]; then
            echo "Could not read app version from app/build.gradle.kts" >&2
            exit 1
          fi
          if [[ "$TAG" != "v$VERSION_NAME" ]]; then
            echo "Release tag $TAG does not match app version v$VERSION_NAME" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Resolve release notes
        id: release_notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          MANUAL_CHANGELOG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.changelog || '' }}
        run: |
          set -euo pipefail
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          if [[ -n "$MANUAL_CHANGELOG" ]]; then
            printf '%s\n' "$MANUAL_CHANGELOG" > "$NOTES_FILE"
            echo "source=manual" >> "$GITHUB_OUTPUT"
          else
            # actions/checkout 会把 tag 事件中的本地注解标签覆写成指向 commit 的轻量标签
            # （testRef 比较注解对象与 GITHUB_SHA 不一致后重新 fetch +<sha>:refs/tags/<tag>），
            # 因此不能依赖本地 tag；改从 GitHub API 读取远端标签对象的消息。
            TAG_OBJECT_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" --jq '.object.sha')"
            TAG_OBJECT_TYPE="$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" --jq '.object.type')"
            if [[ "$TAG_OBJECT_TYPE" == "tag" ]]; then
              TAG_MESSAGE="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJECT_SHA}" --jq '.message')"
            else
              TAG_MESSAGE="$(git log -1 --format='%B' "$TAG_OBJECT_SHA")"
            fi
            TAG_MESSAGE="$(printf '%s\n' "$TAG_MESSAGE" | sed -e '/./,$!d')"
            if [[ -n "$TAG_MESSAGE" ]]; then
              printf '%s\n' "$TAG_MESSAGE" > "$NOTES_FILE"
              echo "source=tag" >> "$GITHUB_OUTPUT"
            else
              : > "$NOTES_FILE"
              echo "source=none" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Validate release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required repository secret: $name" >&2
              exit 1
            fi
          done

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/mica-release.jks"

      - name: Assemble signed release APK
        env:
          MICA_KEYSTORE_FILE: ${{ runner.temp }}/mica-release.jks
          MICA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MICA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MICA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          UPDATE_DOMESTIC_MANIFEST_URL: ${{ env.DOMESTIC_MANIFEST_URL }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest :app:lintDebug \
            --no-configuration-cache
          ./gradlew :app:assembleRelease \
            --no-configuration-cache \
            -Pmica.update.domesticUrl="$UPDATE_DOMESTIC_MANIFEST_URL"

      - name: Verify release APK signature
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$APK_PATH" ]]; then
            echo "Release APK not found: $APK_PATH" >&2
            exit 1
          fi
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "Android apksigner was not found" >&2
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK_PATH"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mica-release-apk-${{ steps.metadata.outputs.tag }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          NOTES_SOURCE: ${{ steps.release_notes.outputs.source }}
          NOTES_FILE: ${{ steps.release_notes.outputs.file }}
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --clobber
            if [[ "$NOTES_SOURCE" != "none" && -s "$NOTES_FILE" ]]; then
              gh release edit "$TAG" --notes-file "$NOTES_FILE"
            fi
          elif [[ "$NOTES_SOURCE" != "none" && -s "$NOTES_FILE" ]]; then
            gh release create "$TAG" "$APK_PATH" \
              --target "$GITHUB_SHA" \
              --title "Mica $TAG" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" "$APK_PATH" \
              --target "$GITHUB_SHA" \
              --title "Mica $TAG" \
              --generate-notes
          fi

      - name: Read release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          NOTES_SOURCE: ${{ steps.release_notes.outputs.source }}
          NOTES_FILE: ${{ steps.release_notes.outputs.file }}
        run: |
          set -euo pipefail
          if [[ "$NOTES_SOURCE" != "none" && -s "$NOTES_FILE" ]]; then
            cp "$NOTES_FILE" "${RUNNER_TEMP}/release-notes-final.md"
          else
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.body' > "${RUNNER_TEMP}/release-notes-final.md"
          fi
          if [[ ! -s "${RUNNER_TEMP}/release-notes-final.md" ]]; then
            printf '%s\n' '此版本暂无更新日志。' > "${RUNNER_TEMP}/release-notes-final.md"
          fi

      - name: Generate update.json
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/generate_update_manifest.py \
            --gradle-file app/build.gradle.kts \
            --changelog-file "${RUNNER_TEMP}/release-notes-final.md" \
            --domestic-download-url "$DOMESTIC_DOWNLOAD_URL" \
            --github-download-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
            --tag "$TAG" \
            --output site/update.json
          cat site/update.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy update.json to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

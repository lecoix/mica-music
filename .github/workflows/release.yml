name: Release APK

on:
  push:
    tags:
      - 'mica-v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Build release APK (beta signing)
        run: chmod +x gradlew && ./gradlew :app:assembleRelease -PbetaRelease --no-daemon --no-configuration-cache

      - name: Rename APK
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#mica-v}"
          echo "RELEASE_TITLE=mica ${VERSION}" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk \
            "mica-music-${VERSION}-arm64-v8a.apk"
          ls -lh mica-music-*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_TITLE }}
          files: mica-music-*-arm64-v8a.apk
          generate_release_notes: true
          draft: false
          prerelease: true

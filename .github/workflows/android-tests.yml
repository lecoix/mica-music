name: Android tests

on:
  pull_request:
  push:
    branches:
      - main
      - exoplayer-only
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :app:compileDebugKotlin :app:lintDebug --no-configuration-cache
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*

  jvm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :app:testDebugUnitTest --no-configuration-cache
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-report
          path: |
            app/build/reports/tests/
            app/build/test-results/

  screenshots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: .\gradlew.bat :app:micaScreenshotFull --no-configuration-cache
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-differences
          path: |
            app/build/outputs/roborazzi/
            app/build/reports/
